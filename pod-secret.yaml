apiVersion: v1 
kind: Pod
metadata:
  name: my-pod-secret-inject
  labels:
    app: revise
    env: Dev
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80
      envFrom:
        - secretRef:
            name: my-secret

            

      
      
      
      
      
      
      
      
